services:
  - type: web
    name: intelligent-fraud-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: BACKEND_CORS_ORIGINS
        value: https://intelligent-fraud-ui.vercel.app # Example Vercel URL
